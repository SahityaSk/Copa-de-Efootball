<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copa de eFootball 2026</title>
  <meta name="description" content="Manage and view the 32-team Copa de eFootball Esports Tournament in real-time.">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Desktop Header -->
    <header class="app-header">
      <div class="logo-container">
        <div class="logo-icon">🏆</div>
        <div class="logo-text">Copa de <span>eFootball</span></div>
      </div>
      <nav class="desktop-nav">
        <a href="#dashboard" class="desktop-nav-link" id="nav-dashboard"><i data-lucide="home"></i> Dashboard</a>
        <a href="#draw" class="desktop-nav-link" id="nav-draw"><i data-lucide="dices"></i> Draw</a>
        <a href="#groups" class="desktop-nav-link" id="nav-groups"><i data-lucide="columns-3"></i> Groups</a>
        <a href="#fixtures" class="desktop-nav-link" id="nav-fixtures"><i data-lucide="calendar"></i> Fixtures</a>
        <a href="#knockout" class="desktop-nav-link" id="nav-knockout"><i data-lucide="award"></i> Knockout</a>
        <a href="#results" class="desktop-nav-link" id="nav-results"><i data-lucide="clipboard-check"></i> Results</a>
        <a href="#statistics" class="desktop-nav-link" id="nav-statistics"><i data-lucide="bar-chart-3"></i> Stats</a>
        <a href="#teams" class="desktop-nav-link" id="nav-teams"><i data-lucide="users"></i> Teams</a>
        <a href="#admin" class="desktop-nav-link admin-nav-item" id="nav-admin" style="display:none;"><i data-lucide="settings"></i> Admin</a>
      </nav>
      <div class="header-admin-auth">
        <button id="admin-login-trigger" title="Admin Login" class="btn-discrete-login" aria-label="Admin Login">
          <i data-lucide="lock" style="width:16px; height:16px;"></i>
        </button>
        <div id="admin-session-badge" class="admin-session-badge" style="display:none;">
          <span class="badge-admin-label"><i data-lucide="shield-check" style="width:14px; height:14px;"></i> Admin</span>
          <button id="btn-header-logout" class="btn-logout-mini" title="Sign Out">Logout</button>
        </div>
      </div>
    </header>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
      <a href="#dashboard" class="mobile-nav-link"><i data-lucide="home"></i><span>Home</span></a>
      <a href="#draw" class="mobile-nav-link"><i data-lucide="dices"></i><span>Draw</span></a>
      <a href="#groups" class="mobile-nav-link"><i data-lucide="columns-3"></i><span>Groups</span></a>
      <a href="#fixtures" class="mobile-nav-link"><i data-lucide="calendar"></i><span>Fixtures</span></a>
      <a href="#knockout" class="mobile-nav-link"><i data-lucide="award"></i><span>Knockout</span></a>
      <a href="#admin" class="mobile-nav-link admin-nav-item" style="display:none;"><i data-lucide="settings"></i><span>Admin</span></a>
    </nav>

    <!-- MAIN SPA CONTAINER -->
    <main class="app-main">
      
      <!-- Toast Container -->
      <div id="toast-container"></div>

      <!-- 1. DASHBOARD PAGE -->
      <section id="dashboard-section" class="page-section">
        <!-- Hero, Countdown, Live match ticker render here -->
      </section>

      <!-- 2. GROUP DRAW PAGE -->
      <section id="draw-section" class="page-section">
        <!-- Cinematic draw bowl, pots, group assignment animation -->
      </section>

      <!-- 3. GROUPS STANDINGS PAGE -->
      <section id="groups-section" class="page-section">
        <!-- A-H tabs, Standings tables, corresponding results -->
      </section>

      <!-- 4. FIXTURES PAGE -->
      <section id="fixtures-section" class="page-section">
        <!-- Matchday calendar with 8 matches per day -->
      </section>

      <!-- 5. RESULTS PAGE -->
      <section id="results-section" class="page-section">
        <!-- Completed results with filtering/search -->
      </section>

      <!-- 6. MATCH CENTER / DETAILS PAGE -->
      <section id="match-center-section" class="page-section">
        <!-- Detailed statistics, timeline events, rosters -->
      </section>

      <!-- 7. KNOCKOUT BRACKET PAGE -->
      <section id="knockout-section" class="page-section">
        <!-- Scrollable bracket trees from R16 to Final -->
      </section>

      <!-- 8. TEAMS DIRECTORY PAGE -->
      <section id="teams-section" class="page-section">
        <!-- Responsive grid of 32 teams -->
      </section>

      <!-- 9. TEAM PROFILE PAGE -->
      <section id="team-profile-section" class="page-section">
        <!-- Selected team profile, squad list, fixtures, rankings -->
      </section>

      <!-- 10. STATISTICS HUB PAGE -->
      <section id="statistics-section" class="page-section">
        <!-- Leaderboards of scorers, clean sheets, wins, etc. -->
      </section>

      <!-- 11. FINAL CINEMATIC PAGE -->
      <section id="final-section" class="page-section">
        <!-- Trophy celebration, confetti, match summary -->
      </section>

      <!-- 12. ADMIN CONTROL PAGE -->
      <section id="admin-section" class="page-section">
        <!-- Result editor, database configurations, state reset -->
      </section>

    </main>

  </div>

  <!-- Admin Auth Modal -->
  <div id="admin-auth-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content glass-card" style="max-width: 420px; padding: 28px; border-radius: 16px; position:relative; box-shadow: 0 12px 40px rgba(0,0,0,0.6);">
      <button id="modal-close-btn" class="modal-close" style="position:absolute; top:16px; right:16px; background:transparent; border:none; color:var(--color-text-secondary); font-size:1.5rem; cursor:pointer;">&times;</button>
      <div style="text-align:center; margin-bottom: 20px;">
        <span style="font-size:2.5rem;">🔐</span>
        <h3 style="font-family:var(--font-display); margin-top:8px; font-size:1.4rem;">Admin Access</h3>
        <p style="font-size:0.8rem; color:var(--color-text-secondary); margin-top:4px;">Sign in with administrator credentials to manage tournament</p>
      </div>

      <form id="modal-admin-form">
        <div style="display:flex; flex-direction:column; gap:14px;">
          <div>
            <label style="font-size:0.75rem; text-transform:uppercase; color:var(--color-text-secondary); font-weight:600; display:block; margin-bottom:4px;">Username</label>
            <input type="text" id="modal-auth-username" value="admin" required style="width:100%; background:var(--bg-primary); border:1px solid var(--glass-border); padding:10px; border-radius:6px; color:var(--color-text-primary); outline:none; font-size:0.9rem;">
          </div>
          <div>
            <label style="font-size:0.75rem; text-transform:uppercase; color:var(--color-text-secondary); font-weight:600; display:block; margin-bottom:4px;">Password</label>
            <input type="password" id="modal-auth-password" required placeholder="••••••••" style="width:100%; background:var(--bg-primary); border:1px solid var(--glass-border); padding:10px; border-radius:6px; color:var(--color-text-primary); outline:none; font-size:0.9rem;">
          </div>
          <button type="submit" class="btn-primary" style="justify-content:center; padding:10px; font-weight:700; margin-top:6px; width:100%;">
            Sign In as Admin
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lucide Icon Library -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Confetti script -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Main Application Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
